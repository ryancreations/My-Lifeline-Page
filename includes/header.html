<script>
// Provide lightweight header helpers only if the page doesn't define them.
if (typeof navigateTo === 'undefined') {
  function navigateTo(page) { window.location.href = page; }
}
if (typeof toggleMobileMenu === 'undefined') {
  function toggleMobileMenu(){
    const menu = document.getElementById('navMenu');
    if(menu) menu.classList.toggle('hidden');
  }
}
// Small wiring for header buttons (won't override page-specific implementations)
(function(){
  const hb = document.getElementById('header-hamburger');
  if(hb) hb.addEventListener('click', toggleMobileMenu);
  const th = document.getElementById('header-toggle-theme');
  if(th && typeof toggleDarkMode !== 'undefined') th.addEventListener('click', toggleDarkMode);
  else if(th){ th.addEventListener('click', function(){
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    try{ localStorage.setItem('lifeline-theme', isDark ? 'light' : 'dark'); }catch(e){}
  }); }
  const ld = document.getElementById('header-lockdown');
  if(ld && typeof activateLockdown !== 'undefined') ld.addEventListener('click', activateLockdown);
  else if(ld){ ld.addEventListener('click', function(){ const el = document.getElementById('lockdown'); if(el) el.style.display='flex'; }); }
  const lo = document.getElementById('header-logout');
  if(lo && typeof logout !== 'undefined') lo.addEventListener('click', logout);
  else if(lo){ lo.addEventListener('click', function(){ if(confirm('Leave your safe space?')){ try{ localStorage.clear(); }catch(e){} window.location.reload(); } }); }
})();
</script>
