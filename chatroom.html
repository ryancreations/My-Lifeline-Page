<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatroom • My Lifeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #00bcd4;
      --accent: #ff9ff3;
      --bg-light: linear-gradient(135deg, #fff8f0 0%, #e0f7ff 100%);
      --card: #ffffff;
      --text: #2c3e50;
      --shadow: rgba(0,0,0,0.12);
    }
    [data-theme="dark"] {
      --bg-light: linear-gradient(135deg, #0f1c2e 0%, #2c1e3a 100%);
      --card: #2c3e50;
      --text: #e0f2f1;
      --primary: #4fc3f7;
      --accent: #ff79c6;
      --shadow: rgba(0,0,0,0.4);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--bg-light);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.6s ease;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(135, 206, 235, 0.97);
      backdrop-filter: blur(12px);
      z-index: 1000;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 20px var(--shadow);
    }
    [data-theme="dark"] nav { background: rgba(26, 38, 57, 0.97); }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      background: white;
      color: var(--primary);
      border: none;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
    }

    .floating-bestie {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 75px;
      height: 75px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      box-shadow: 0 10px 30px rgba(255,159,243,0.5);
      cursor: pointer;
      z-index: 999;
    }

    /* Auth / Chat boxes */
    #auth-box, #signup-box, #chat-box {
      max-width: 480px;
      margin: 110px auto 40px;
      background: var(--card);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 15px 40px var(--shadow);
    }

    h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      margin: 10px 0;
      border-radius: 16px;
      border: 2px solid var(--primary);
      background: transparent;
      color: var(--text);
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 30px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    #login-btn, #send-btn { background: var(--primary); color: white; }
    #signup-submit-btn { background: #27ae60; color: white; }
    #logout-btn {
      background: #e74c3c;
      color: white;
      width: auto;
      padding: 8px 20px;
      margin: 0 auto 16px;
      display: block;
    }

    #messages {
      height: 48vh;
      overflow-y: auto;
      padding: 16px;
      margin: 20px 0;
      border-radius: 20px;
      background: rgba(0,0,0,0.03);
    }
    [data-theme="dark"] #messages { background: rgba(0,0,0,0.2); }

    /* iMessage-style bubbles */
    .message {
      max-width: 78%;
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 20px;
      position: relative;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .message.sent {
      background: #007aff;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 6px;
    }
    .message.received {
      background: #e5e5ea;
      color: #000;
      margin-right: auto;
      border-bottom-left-radius: 6px;
    }
    [data-theme="dark"] .message.received {
      background: #3a3a3c;
      color: white;
    }

    .message .name {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .message .time {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    .react-btn {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      margin-left: 6px;
      opacity: 0.7;
    }
    .react-btn:hover { opacity: 1; }

    #input-area {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    #message-input {
      flex: 1;
      border-radius: 30px;
    }
    #send-btn {
      width: auto;
      padding: 12px 24px;
    }

    .tagline {
      text-align: center;
      opacity: 0.8;
      margin-bottom: 16px;
    }
  </style>
</head>
<body data-theme="light">

  <nav>
    <div class="logo"><span>🫂</span> My Lifeline</div>
    <div style="display:flex; gap:12px;">
      <button class="nav-btn" onclick="location.href='index.html'">← Dashboard</button>
      <button class="nav-btn" onclick="toggleDarkMode()">🌗</button>
    </div>
  </nav>

  <div class="floating-bestie" onclick="location.href='bestie.html'">🫂</div>

  <!-- Login -->
  <div id="auth-box">
    <h2>Login to Lifeline 💙</h2>
    <input id="login-email" type="email" placeholder="Email">
    <input id="login-password" type="password" placeholder="Password">
    <button id="login-btn" onclick="login()">Login</button>
    <button onclick="showSignup()" style="background:#27ae60;color:white;">Sign Up</button>
    <button id="google-signin-btn" onclick="signInWithGoogle()" style="background:white;color:#333;border:2px solid #ddd;">
      Sign in with Google
    </button>
    <p id="auth-error" style="color:#e74c3c;text-align:center;margin-top:12px;"></p>
  </div>

  <!-- Signup -->
  <div id="signup-box" style="display:none;">
    <h2>Sign Up for Lifeline 💙</h2>
    <input id="nickname" type="text" placeholder="Nickname (at least 3 characters)">
    <input id="signup-email" type="email" placeholder="Email">
    <input id="signup-password" type="password" placeholder="Password (min 6 characters)">
    <input id="confirm-password" type="password" placeholder="Confirm Password">
    <button id="signup-submit-btn" onclick="signup()">Create Account</button>
    <p id="signup-error" style="color:#e74c3c;text-align:center;margin-top:12px;"></p>
    <p style="text-align:center;margin-top:16px;cursor:pointer;color:var(--primary);" onclick="showLogin()">← Back to Login</p>
  </div>

  <!-- Chat -->
  <div id="chat-box" style="display:none;">
    <h2>Lifeline Chatroom 💬</h2>
    <p class="tagline">You're safe here. Everyone's going through something.</p>
    <p style="text-align:center;">Logged in as: <strong id="user-display"></strong></p>
    <button id="logout-btn" onclick="logout()">Logout</button>

    <div id="messages"></div>

    <div id="input-area">
      <input type="text" id="message-input" placeholder="Type a message..." />
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyCNDM2yeyVTWMU_pOQoUt6-uNOQAzHPkik",
      authDomain: "chatroomnew-739f4.firebaseapp.com",
      databaseURL: "https://chatroomnew-739f4-default-rtdb.firebaseio.com",
      projectId: "chatroomnew-739f4",
      storageBucket: "chatroomnew-739f4.firebasestorage.app",
      messagingSenderId: "552292977529",
      appId: "1:552292977529:web:b04e2bc662668847ba7da8",
      measurementId: "G-SCWPR39FCD"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, serverTimestamp, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const messagesRef = ref(db, 'lifeline-chat');

    // Theme
    window.toggleDarkMode = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('lifeline-theme', isDark ? 'light' : 'dark');
    };
    if (localStorage.getItem('lifeline-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('signup-box').style.display = 'none';
        document.getElementById('chat-box').style.display = 'block';
        document.getElementById('user-display').textContent = user.displayName || user.email.split('@')[0];
        loadMessages();
      } else {
        document.getElementById('auth-box').style.display = 'block';
        document.getElementById('signup-box').style.display = 'none';
        document.getElementById('chat-box').style.display = 'none';
      }
    });

    window.showSignup = () => {
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('signup-box').style.display = 'block';
    };
    window.showLogin = () => {
      document.getElementById('auth-box').style.display = 'block';
      document.getElementById('signup-box').style.display = 'none';
    };

    window.signInWithGoogle = async () => {
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        document.getElementById('auth-error').textContent = error.message || 'Google sign-in failed';
      }
    };

    window.login = () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      signInWithEmailAndPassword(auth, email, password)
        .catch(err => document.getElementById('auth-error').textContent = err.message);
    };

    window.signup = async () => {
      const nickname = document.getElementById('nickname').value.trim();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errorEl = document.getElementById('signup-error');

      if (nickname.length < 3) return errorEl.textContent = 'Nickname must be at least 3 characters.';
      if (password !== confirmPassword) return errorEl.textContent = 'Passwords do not match!';
      if (password.length < 6) return errorEl.textContent = 'Password must be at least 6 characters.';

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCredential.user, { displayName: nickname });
      } catch (err) {
        errorEl.textContent = err.message;
      }
    };

    window.logout = () => signOut(auth);

    window.sendMessage = () => {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !auth.currentUser) return;

      push(messagesRef, {
        name: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
        text,
        timestamp: serverTimestamp(),
        uid: auth.currentUser.uid,
        reactions: {}
      }).then(() => input.value = '');
    };

    function formatTime(ts) {
      if (!ts) return '';
      const date = new Date(ts);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function loadMessages() {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '';

      onChildAdded(messagesRef, (snapshot) => {
        const msg = snapshot.val();
        if (!msg?.text) return;

        const isSent = msg.uid === auth.currentUser?.uid;
        const div = document.createElement('div');
        div.className = `message ${isSent ? 'sent' : 'received'}`;
        div.dataset.id = snapshot.key;

        div.innerHTML = `
          ${!isSent ? `<div class="name">${msg.name}</div>` : ''}
          <div>${msg.text}</div>
          <div class="time">
            ${formatTime(msg.timestamp)}
            <button class="react-btn" onclick="reactToMessage('${snapshot.key}')">❤️</button>
          </div>
        `;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    // Simple heart reaction
    window.reactToMessage = (msgId) => {
      if (!auth.currentUser) return;
      const reactionRef = ref(db, `lifeline-chat/${msgId}/reactions/${auth.currentUser.uid}`);
      // Toggle heart (simple version)
      update(ref(db, `lifeline-chat/${msgId}/reactions`), {
        [auth.currentUser.uid]: '❤️'
      });
    };

    document.getElementById('message-input')?.addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
