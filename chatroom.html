<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chatroom • My Lifeline</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --header-bg: rgba(249, 249, 249, 0.94);
      --bubble-sent: #007aff;
      --bubble-received: #e9e9eb;
      --text: #000;
      --input-bg: white;
      --border: rgba(0,0,0,0.15);
    }
    [data-theme="dark"] {
      --bg: #000;
      --header-bg: rgba(28, 28, 30, 0.94);
      --bubble-sent: #0a84ff;
      --bubble-received: #1c1c1e;
      --text: #fff;
      --input-bg: #1c1c1e;
      --border: rgba(255,255,255,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .imessage-header {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      background: var(--header-bg);
      backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 100;
    }
    .back-btn { color: #007aff; font-size: 17px; background: none; border: none; cursor: pointer; }
    .header-title { font-size: 17px; font-weight: 600; flex: 1; text-align: center; }

    #chat-container {
      position: fixed; top: 56px; bottom: 70px; left: 0; right: 0;
      overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 3px;
      background: var(--bg);
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 78%; padding: 9px 14px; border-radius: 18px;
      font-size: 16px; line-height: 1.35; position: relative;
      word-wrap: break-word; user-select: none;
    }
    .message.sent { background: var(--bubble-sent); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message.received { background: var(--bubble-received); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; }
    .message .sender-name { font-size: 12px; opacity: 0.7; margin-bottom: 3px; font-weight: 500; }
    .message .timestamp { font-size: 11px; opacity: 0.7; margin-top: 4px; text-align: right; }
    .message img { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }
    .message a { color: inherit; text-decoration: underline; }

    #reply-preview {
      display: none; background: var(--bubble-received); padding: 8px 14px;
      font-size: 14px; border-left: 4px solid #007aff; margin-bottom: 6px;
      border-radius: 8px; position: relative;
    }
    #reply-preview .cancel-reply {
      position: absolute; right: 10px; top: 8px; color: #007aff; cursor: pointer; font-weight: 600;
    }

    #context-menu {
      position: fixed; background: var(--input-bg); color: var(--text);
      border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      z-index: 1000; display: none; overflow: hidden; min-width: 190px;
    }
    #context-menu button {
      display: block; width: 100%; padding: 14px 18px; border: none;
      background: none; text-align: left; font-size: 16px; cursor: pointer; color: var(--text);
    }
    #context-menu button:active { background: rgba(0,0,0,0.08); }
    #context-menu button.delete { color: #ff3b30; }

    .imessage-input-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--header-bg);
      backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--border);
      padding: 8px 12px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .input-row { display: flex; align-items: flex-end; gap: 8px; }
    #message-input {
      flex: 1; border: none; background: var(--input-bg); color: var(--text);
      border-radius: 20px; padding: 10px 16px; font-size: 16px; outline: none;
      box-shadow: 0 0 0 0.5px var(--border);
    }
    .icon-btn, #send-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .icon-btn { background: var(--bubble-received); color: var(--text); }
    #send-btn { background: #007aff; color: white; }

    #browser-screen {
      position: fixed; inset: 0; background: #111; z-index: 300;
      display: none; flex-direction: column;
    }
    #browser-header {
      height: 48px; background: #1c1c1e; color: white;
      display: flex; align-items: center; padding: 0 16px; gap: 10px;
    }
    #browser-container { flex: 1; width: 100%; background: #000; }
    #close-browser, #new-session-btn {
      border: none; padding: 7px 14px; border-radius: 8px;
      font-weight: 600; cursor: pointer; color: white;
    }
    #close-browser { background: #ff3b30; }
    #new-session-btn { background: #007aff; }

    #call-screen {
      position: fixed; inset: 0; background: #000; z-index: 400;
      display: none; flex-direction: column; color: #fff;
    }
    #call-header {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: rgba(0,0,0,0.65);
    }
    #call-status { font-size: 16px; font-weight: 600; }
    #end-call {
      background: #ff3b30; color: #fff; border: none;
      padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    #call-body {
      flex: 1; position: relative; display: flex;
      align-items: center; justify-content: center; gap: 48px; overflow: hidden;
    }
    .avatar-wrap {
      position: relative; width: 140px; height: 140px; z-index: 2;
    }
    .avatar-wrap img {
      width: 100%; height: 100%; border-radius: 50%;
      object-fit: cover; background: #222;
    }
    .ring {
      position: absolute; inset: -8px; border-radius: 50%;
      border: 4px solid transparent; transition: all 0.15s;
    }
    .ring.active {
      border-color: #43b581;
      box-shadow: 0 0 22px #43b581;
    }
    #remote-video, #local-video {
      position: absolute; border-radius: 12px;
      background: #111; object-fit: cover;
    }
    #remote-video { inset: 0; width: 100%; height: 100%; z-index: 1; }
    #local-video {
      bottom: 16px; right: 16px; width: 110px; height: 150px;
      border: 2px solid #333; z-index: 5;
    }
    #call-controls {
      display: flex; gap: 16px; justify-content: center; padding: 18px;
    }
    #call-controls button {
      width: 56px; height: 56px; border-radius: 50%; border: none;
      font-size: 22px; cursor: pointer; background: #2a2a2a; color: white;
    }
    #call-controls button.muted { background: #ff3b30; }

    /* Bigger incoming call popup for mobile */
    #incoming-call {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #1c1c1e; color: white; padding: 24px 28px;
      border-radius: 20px; z-index: 500; display: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5); text-align: center;
      min-width: 280px; width: 85%; max-width: 340px;
    }
    #incoming-name {
      font-size: 18px; font-weight: 600; margin-bottom: 18px;
    }
    #incoming-call button {
      margin: 6px; padding: 14px 28px; border: none;
      border-radius: 12px; font-weight: 600; cursor: pointer;
      font-size: 16px; min-width: 110px;
    }
    #accept-call { background: #34c759; color: white; }
    #decline-call { background: #ff3b30; color: white; }

    #login-screen, #signup-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; justify-content: center;
      padding: 30px; z-index: 200;
    }
    .login-card {
      background: var(--input-bg); border-radius: 16px; padding: 28px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .login-card h2 { text-align: center; margin-bottom: 24px; font-size: 22px; color: var(--text); }
    .login-card input {
      width: 100%; padding: 14px 16px; margin-bottom: 12px;
      border: 1px solid var(--border); border-radius: 12px;
      font-size: 16px; background: var(--bg); color: var(--text);
    }
    .login-card button {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; margin-top: 8px; cursor: pointer;
    }
    .btn-blue { background: #007aff; color: white; }
    .btn-green { background: #34c759; color: white; }
    .btn-gray { background: var(--bubble-received); color: var(--text); }
    .error-text { color: #ff3b30; text-align: center; margin-top: 12px; font-size: 14px; }
    .pm-badge { background: #007aff; color: white; font-size: 12px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  </style>
</head>
<body data-theme="light">

  <div class="imessage-header">
    <button class="back-btn" id="header-back" onclick="goBack()">← Dashboard</button>
    <div class="header-title" id="header-title">Lifeline Chat</div>
    <div style="display:flex; gap:12px;">
      <button class="back-btn" onclick="toggleDarkMode()">🌓</button>
      <button class="back-btn" onclick="logout()" id="logout-btn" style="display:none;">Logout</button>
    </div>
  </div>

  <div id="chat-container" style="display:none;"></div>

  <div id="context-menu">
    <button onclick="replyToMessage()">Reply</button>
    <button onclick="startPrivateMessage()">PM</button>
    <button onclick="startCall(true)">Call</button>
    <button onclick="openSharedBrowser()">Shared Browser</button>
    <button onclick="copyMessage()">Copy</button>
    <button class="delete" id="delete-btn" onclick="deleteMessage()" style="display:none;">Delete</button>
  </div>

  <div class="imessage-input-bar" id="input-bar" style="display:none;">
    <div id="reply-preview">
      <span id="reply-text"></span>
      <span class="cancel-reply" onclick="cancelReply()">✕</span>
    </div>
    <div class="input-row">
      <button class="icon-btn" onclick="document.getElementById('image-input').click()">📷</button>
      <input type="file" id="image-input" accept="image/*,.gif" style="display:none;">
      <input type="text" id="message-input" placeholder="iMessage" autocomplete="off">
      <button id="send-btn" onclick="sendMessage()">↑</button>
    </div>
  </div>

  <div id="browser-screen">
    <div id="browser-header">
      <span style="flex:1; font-weight:600;">Shared Browser</span>
      <button id="new-session-btn" onclick="forceNewBrowser()">New Session</button>
      <button id="close-browser" onclick="closeSharedBrowser()">Close</button>
    </div>
    <div id="browser-container"></div>
  </div>

  <div id="call-screen">
    <div id="call-header">
      <span id="call-status">Calling…</span>
      <button id="end-call" onclick="endCall()">End</button>
    </div>
    <div id="call-body">
      <div class="avatar-wrap" id="remote-avatar-wrap">
        <img id="remote-avatar" src="" alt="">
        <div class="ring" id="remote-ring"></div>
      </div>
      <div class="avatar-wrap" id="local-avatar-wrap">
        <img id="local-avatar" src="" alt="">
        <div class="ring" id="local-ring"></div>
      </div>
      <video id="remote-video" autoplay playsinline webkit-playsinline></video>
      <video id="local-video" autoplay playsinline webkit-playsinline muted></video>
    </div>
    <div id="call-controls">
      <button id="mute-btn" onclick="toggleMute()">🎤</button>
      <button id="video-btn" onclick="toggleVideo()">📷</button>
    </div>
  </div>

  <div id="incoming-call">
    <div id="incoming-name">Incoming call…</div>
    <div style="display:flex; justify-content:center; gap:12px;">
      <button id="accept-call">Accept</button>
      <button id="decline-call">Decline</button>
    </div>
  </div>

  <div id="login-screen">
    <div class="login-card">
      <h2>Lifeline Chat</h2>
      <input id="login-email" type="email" placeholder="Email">
      <input id="login-password" type="password" placeholder="Password">
      <button class="btn-blue" onclick="login()">Login</button>
      <button class="btn-green" onclick="showSignup()">Create Account</button>
      <button class="btn-gray" onclick="signInWithGoogle()">Continue with Google</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <div id="signup-screen" style="display:none;">
    <div class="login-card">
      <h2>Create Account</h2>
      <input id="nickname" type="text" placeholder="Nickname">
      <input id="signup-email" type="email" placeholder="Email">
      <input id="signup-password" type="password" placeholder="Password">
      <input id="confirm-password" type="password" placeholder="Confirm Password">
      <button class="btn-green" onclick="signup()">Sign Up</button>
      <button class="btn-gray" onclick="showLogin()">Back to Login</button>
      <p id="signup-error" class="error-text"></p>
    </div>
  </div>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyCNDM2yeyVTWMU_pOQoUt6-uNOQAzHPkik",
      authDomain: "chatroomnew-739f4.firebaseapp.com",
      databaseURL: "https://chatroomnew-739f4-default-rtdb.firebaseio.com",
      projectId: "chatroomnew-739f4",
      storageBucket: "chatroomnew-739f4.firebasestorage.app",
      messagingSenderId: "552292977529",
      appId: "1:552292977529:web:b04e2bc662668847ba7da8"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onValue, set, remove, serverTimestamp, get, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import Hyperbeam from "https://unpkg.com/@hyperbeam/web@latest/dist/index.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const auth = getAuth(app);

    let currentChatRef = null;
    let isPrivate = false;
    let privateWith = null;
    let selectedMessage = null;
    let replyTo = null;
    let unsubscribe = null;
    let hbClient = null;

    const servers = {
      iceServers: [
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ],
      iceCandidatePoolSize: 10
    };
    let pc = null;
    let localStream = null;
    let callId = null;
    let remoteUid = null;
    let speakingInterval = null;
    let incomingListener = null;
    let pendingCall = null; // stores the call while waiting for media

    // Theme
    window.toggleDarkMode = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('chat-theme', isDark ? 'light' : 'dark');
    };
    if (localStorage.getItem('chat-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    // Simple notifications
    async function askNotificationPermission() {
      if (!("Notification" in window)) return;
      if (Notification.permission === "granted") return;
      if (Notification.permission !== "denied") {
        await Notification.requestPermission();
      }
    }

    function showNotif(title, body) {
      if (Notification.permission === "granted" && document.hidden) {
        new Notification(title, { body, icon: "/favicon.ico" });
      }
    }

    // Auth
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('signup-screen').style.display = 'none';
        document.getElementById('chat-container').style.display = 'flex';
        document.getElementById('input-bar').style.display = 'flex';
        document.getElementById('logout-btn').style.display = 'block';
        switchToPublic();
        listenForIncomingCalls();
        askNotificationPermission();
      } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('signup-screen').style.display = 'none';
        document.getElementById('chat-container').style.display = 'none';
        document.getElementById('input-bar').style.display = 'none';
        document.getElementById('logout-btn').style.display = 'none';
      }
    });

    window.showSignup = () => {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('signup-screen').style.display = 'flex';
    };
    window.showLogin = () => {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('signup-screen').style.display = 'none';
    };

    window.signInWithGoogle = async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (err) {
        document.getElementById('login-error').textContent = err.message;
      }
    };

    window.login = () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      signInWithEmailAndPassword(auth, email, password)
        .catch(err => document.getElementById('login-error').textContent = err.message);
    };

    window.signup = async () => {
      const nickname = document.getElementById('nickname').value.trim();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('confirm-password').value;
      const errorEl = document.getElementById('signup-error');

      if (nickname.length < 3) return errorEl.textContent = "Nickname too short";
      if (password !== confirm) return errorEl.textContent = "Passwords don't match";
      if (password.length < 6) return errorEl.textContent = "Password too short";

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: nickname });
      } catch (err) {
        errorEl.textContent = err.message;
      }
    };

    window.logout = () => signOut(auth);

    // Shared Browser
    window.openSharedBrowser = async () => {
      document.getElementById('context-menu').style.display = 'none';
      document.getElementById('browser-screen').style.display = 'flex';
      document.getElementById('browser-container').innerHTML = `
        <div style="color:white;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
          <div>Looking for shared browser...</div>
        </div>`;

      try {
        const snapshot = await get(ref(db, 'active-browser-session'));
        const existing = snapshot.val();

        if (existing && existing.embed_url) {
          await loadSession(existing);
          return;
        }

        document.getElementById('browser-container').innerHTML = `
          <div style="color:white;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
            <div>Starting shared browser...</div>
            <div style="font-size:14px;opacity:0.7;">Creating watch party</div>
          </div>`;

        const response = await fetch("/api/create-browser", { method: "POST" });
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || "Failed to create session");
        }

        const data = await response.json();
        await set(ref(db, 'active-browser-session'), {
          embed_url: data.embed_url,
          admin_token: data.admin_token,
          session_id: data.session_id,
          createdAt: Date.now(),
          createdBy: auth.currentUser?.displayName || "Someone"
        });
        await loadSession(data);
      } catch (err) {
        console.error(err);
        document.getElementById('browser-container').innerHTML = `
          <div style="color:white;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;text-align:center;">
            <div style="font-size:18px;">Failed to start browser</div>
            <div style="font-size:14px;opacity:0.7;">${err.message}</div>
            <button onclick="openSharedBrowser()" style="margin-top:16px;padding:10px 20px;border-radius:8px;border:none;background:#007aff;color:white;cursor:pointer;">
              Try Again
            </button>
          </div>`;
      }
    };

    async function loadSession(data) {
      const container = document.getElementById('browser-container');
      container.innerHTML = '';
      try {
        hbClient = await Hyperbeam(container, data.embed_url, { adminToken: data.admin_token });
      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div style="color:white;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
            <div>Failed to load browser</div>
            <button onclick="openSharedBrowser()" style="padding:10px 20px;border-radius:8px;border:none;background:#007aff;color:white;cursor:pointer;">
              Try Again
            </button>
          </div>`;
      }
    }

    window.forceNewBrowser = async () => {
      if (hbClient) { try { hbClient.destroy(); } catch(e) {} hbClient = null; }
      await remove(ref(db, 'active-browser-session'));
      openSharedBrowser();
    };

    window.closeSharedBrowser = () => {
      if (hbClient) { try { hbClient.destroy(); } catch(e) {} hbClient = null; }
      document.getElementById('browser-screen').style.display = 'none';
      document.getElementById('browser-container').innerHTML = '';
    };

    // ========== CALLS (MOBILE FIXED) ==========
    window.startCall = async (withVideo = true) => {
      if (!selectedMessage || !auth.currentUser) return;
      remoteUid = selectedMessage.data.uid;
      if (remoteUid === auth.currentUser.uid) return alert("Can't call yourself");

      document.getElementById('context-menu').style.display = 'none';
      document.getElementById('call-screen').style.display = 'flex';
      document.getElementById('call-status').textContent = 'Calling…';
      document.getElementById('remote-avatar').src = 'https://i.pravatar.cc/150?u=' + remoteUid;
      document.getElementById('local-avatar').src = 'https://i.pravatar.cc/150?u=' + auth.currentUser.uid;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: withVideo });
        document.getElementById('local-video').srcObject = localStream;
      } catch (e) {
        alert('Need mic/camera permission');
        return endCall();
      }

      pc = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

      pc.ontrack = (e) => {
        const remoteVideo = document.getElementById('remote-video');
        remoteVideo.srcObject = e.streams[0];
        remoteVideo.play().catch(() => {});
        document.getElementById('call-status').textContent = 'Connected';
        document.getElementById('remote-avatar-wrap').style.display = 'none';
        document.getElementById('local-avatar-wrap').style.display = 'none';
      };

      startSpeakingDetection(localStream, 'local-ring');

      const newCallRef = push(ref(db, 'calls'));
      callId = newCallRef.key;

      pc.onicecandidate = (e) => {
        if (e.candidate && callId) {
          push(ref(db, `calls/${callId}/callerCandidates`), e.candidate.toJSON());
        }
      };

      await set(newCallRef, {
        caller: auth.currentUser.uid,
        callerName: auth.currentUser.displayName || 'Someone',
        callee: remoteUid,
        status: 'ringing',
        video: withVideo,
        createdAt: Date.now()
      });

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await set(ref(db, `calls/${callId}/offer`), { type: offer.type, sdp: offer.sdp });

      onValue(ref(db, `calls/${callId}/answer`), async (snap) => {
        const ans = snap.val();
        if (ans && pc && !pc.currentRemoteDescription) {
          try {
            await pc.setRemoteDescription(new RTCSessionDescription(ans));
          } catch (err) { console.error(err); }
        }
      });

      onChildAdded(ref(db, `calls/${callId}/calleeCandidates`), (snap) => {
        if (pc) pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(() => {});
      });
    };

    function listenForIncomingCalls() {
      if (incomingListener) return;
      incomingListener = onValue(ref(db, 'calls'), (snap) => {
        const calls = snap.val() || {};
        let found = null;

        for (const id in calls) {
          const data = calls[id];
          if (data.callee === auth.currentUser?.uid && data.status === 'ringing' && !pc) {
            found = { id, data };
            break;
          }
        }

        const popup = document.getElementById('incoming-call');
        if (found) {
          pendingCall = found;
          document.getElementById('incoming-name').textContent =
            (found.data.callerName || 'Someone') + ' is calling…';
          popup.style.display = 'block';
          showNotif("Incoming Call", (found.data.callerName || "Someone") + " is calling you");
        } else {
          popup.style.display = 'none';
          pendingCall = null;
        }
      });
    }

    // Critical mobile fix: getUserMedia must be called directly from the tap
    document.getElementById('accept-call').addEventListener('click', async () => {
      if (!pendingCall) return;
      const { id, data } = pendingCall;
      document.getElementById('incoming-call').style.display = 'none';
      pendingCall = null;
      await answerCall(id, data);
    });

    document.getElementById('decline-call').addEventListener('click', async () => {
      if (!pendingCall) return;
      const { id } = pendingCall;
      document.getElementById('incoming-call').style.display = 'none';
      pendingCall = null;
      await update(ref(db, `calls/${id}`), { status: 'declined' });
    });

    window.answerCall = async (id, data) => {
      callId = id;
      remoteUid = data.caller;

      document.getElementById('call-screen').style.display = 'flex';
      document.getElementById('call-status').textContent = 'Connecting…';
      document.getElementById('remote-avatar').src = 'https://i.pravatar.cc/150?u=' + remoteUid;
      document.getElementById('local-avatar').src = 'https://i.pravatar.cc/150?u=' + auth.currentUser.uid;

      // This is called from the Accept button click → works on mobile
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: data.video !== false
        });
        const localVideo = document.getElementById('local-video');
        localVideo.srcObject = localStream;
        localVideo.play().catch(() => {});
      } catch (e) {
        console.error(e);
        alert('Need mic/camera permission. Please allow and try again.');
        return endCall();
      }

      pc = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

      pc.ontrack = (e) => {
        const remoteVideo = document.getElementById('remote-video');
        remoteVideo.srcObject = e.streams[0];
        remoteVideo.play().catch(() => {});
        document.getElementById('call-status').textContent = 'Connected';
        document.getElementById('remote-avatar-wrap').style.display = 'none';
        document.getElementById('local-avatar-wrap').style.display = 'none';
      };

      startSpeakingDetection(localStream, 'local-ring');

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          push(ref(db, `calls/${id}/calleeCandidates`), e.candidate.toJSON());
        }
      };

      const offerSnap = await get(ref(db, `calls/${id}/offer`));
      const offer = offerSnap.val() || data.offer;
      if (!offer) {
        alert('Call offer missing');
        return endCall();
      }

      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await set(ref(db, `calls/${id}/answer`), { type: answer.type, sdp: answer.sdp });
      await update(ref(db, `calls/${id}`), { status: 'connected' });

      onChildAdded(ref(db, `calls/${id}/callerCandidates`), (snap) => {
        if (pc) pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(() => {});
      });
    };

    function startSpeakingDetection(stream, ringId) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 256;
        const data = new Uint8Array(analyser.frequencyBinCount);

        if (speakingInterval) clearInterval(speakingInterval);
        speakingInterval = setInterval(() => {
          analyser.getByteFrequencyData(data);
          const vol = data.reduce((a, b) => a + b, 0) / data.length;
          document.getElementById(ringId)?.classList.toggle('active', vol > 18);
        }, 100);
      } catch (e) {}
    }

    window.endCall = async () => {
      if (pc) { pc.close(); pc = null; }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (speakingInterval) {
        clearInterval(speakingInterval);
        speakingInterval = null;
      }
      if (callId) {
        try { await remove(ref(db, `calls/${callId}`)); } catch(e) {}
        callId = null;
      }
      document.getElementById('call-screen').style.display = 'none';
      document.getElementById('remote-video').srcObject = null;
      document.getElementById('local-video').srcObject = null;
      document.getElementById('remote-avatar-wrap').style.display = 'block';
      document.getElementById('local-avatar-wrap').style.display = 'block';
      document.getElementById('local-ring')?.classList.remove('active');
      document.getElementById('remote-ring')?.classList.remove('active');
    };

    window.toggleMute = () => {
      const track = localStream?.getAudioTracks()[0];
      if (!track) return;
      track.enabled = !track.enabled;
      document.getElementById('mute-btn').classList.toggle('muted', !track.enabled);
    };

    window.toggleVideo = () => {
      const track = localStream?.getVideoTracks()[0];
      if (!track) return;
      track.enabled = !track.enabled;
      document.getElementById('video-btn').classList.toggle('muted', !track.enabled);
    };

    // Private chat
    function getPrivateChatId(uid1, uid2) {
      return [uid1, uid2].sort().join('_');
    }

    window.startPrivateMessage = () => {
      if (!selectedMessage || !auth.currentUser) return;
      const otherUid = selectedMessage.data.uid;
      const otherName = selectedMessage.data.name;
      if (otherUid === auth.currentUser.uid) return alert("You can't PM yourself");

      const chatId = getPrivateChatId(auth.currentUser.uid, otherUid);
      currentChatRef = ref(db, `private-chats/${chatId}`);
      isPrivate = true;
      privateWith = { uid: otherUid, name: otherName };

      document.getElementById('header-title').innerHTML = `PM • ${otherName} <span class="pm-badge">Private</span>`;
      document.getElementById('header-back').textContent = '← Public Chat';
      document.getElementById('context-menu').style.display = 'none';
      loadMessages();
    };

    window.goBack = () => {
      if (isPrivate) switchToPublic();
      else location.href = 'index.html';
    };

    function switchToPublic() {
      currentChatRef = ref(db, 'lifeline-chat');
      isPrivate = false;
      privateWith = null;
      document.getElementById('header-title').textContent = 'Lifeline Chat';
      document.getElementById('header-back').textContent = '← Dashboard';
      loadMessages();
    }

    // Messages
    function showContextMenu(e, msgData, element) {
      e.preventDefault();
      selectedMessage = { data: msgData, element, key: element.dataset.key };
      const menu = document.getElementById('context-menu');
      menu.style.display = 'block';
      const x = e.clientX || (e.touches && e.touches[0].clientX) || 100;
      const y = e.clientY || (e.touches && e.touches[0].clientY) || 100;
      menu.style.left = Math.min(x, window.innerWidth - 210) + 'px';
      menu.style.top = Math.min(y, window.innerHeight - 280) + 'px';
      document.getElementById('delete-btn').style.display =
        (msgData.uid === auth.currentUser?.uid) ? 'block' : 'none';
    }

    document.addEventListener('click', () => {
      document.getElementById('context-menu').style.display = 'none';
    });

    window.replyToMessage = () => {
      if (!selectedMessage) return;
      replyTo = selectedMessage.data;
      document.getElementById('reply-preview').style.display = 'block';
      document.getElementById('reply-text').textContent = `Replying to ${replyTo.name}: ${replyTo.text || 'Image'}`;
      document.getElementById('context-menu').style.display = 'none';
      document.getElementById('message-input').focus();
    };

    window.cancelReply = () => {
      replyTo = null;
      document.getElementById('reply-preview').style.display = 'none';
    };

    window.copyMessage = () => {
      if (!selectedMessage) return;
      navigator.clipboard.writeText(selectedMessage.data.text || selectedMessage.data.imageUrl || '');
      document.getElementById('context-menu').style.display = 'none';
    };

    window.deleteMessage = async () => {
      if (!selectedMessage || !selectedMessage.key) return;
      if (!confirm('Delete this message?')) return;
      try {
        const path = isPrivate
          ? `private-chats/${getPrivateChatId(auth.currentUser.uid, privateWith.uid)}/${selectedMessage.key}`
          : `lifeline-chat/${selectedMessage.key}`;
        await remove(ref(db, path));
        selectedMessage.element.remove();
      } catch (err) {
        alert('Could not delete message');
      }
      document.getElementById('context-menu').style.display = 'none';
    };

    window.sendMessage = () => {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !auth.currentUser || !currentChatRef) return;

      const isMediaLink = /\.(gif|png|jpg|jpeg|webp)(\?.*)?$/i.test(text) ||
        text.includes('giphy.com') || text.includes('tenor.com');

      const messageData = {
        name: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
        timestamp: serverTimestamp(),
        uid: auth.currentUser.uid
      };

      if (isMediaLink) {
        messageData.type = 'image';
        messageData.imageUrl = text;
      } else {
        messageData.type = 'text';
        messageData.text = text;
      }

      if (replyTo) {
        messageData.replyTo = { name: replyTo.name, text: replyTo.text || 'Image' };
      }

      push(currentChatRef, messageData);
      input.value = '';
      cancelReply();
    };

    document.getElementById('image-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !auth.currentUser || !currentChatRef) return;

      const btn = document.getElementById('send-btn');
      btn.textContent = '…';
      btn.disabled = true;

      try {
        const fileRef = storageRef(storage, `chat-images/${Date.now()}_${file.name}`);
        await uploadBytes(fileRef, file);
        const url = await getDownloadURL(fileRef);
        push(currentChatRef, {
          name: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
          imageUrl: url,
          timestamp: serverTimestamp(),
          uid: auth.currentUser.uid,
          type: 'image'
        });
      } catch (err) {
        alert('Image upload failed.');
      }

      btn.textContent = '↑';
      btn.disabled = false;
      e.target.value = '';
    });

    function linkify(text) {
      return text.replace(/(https?:\/\/[^\s]+)/g, url => {
        if (/\.(gif|png|jpg|jpeg|webp)(\?.*)?$/i.test(url) || url.includes('giphy.com') || url.includes('tenor.com')) {
          return `<img src="${url}" alt="media" style="max-width:100%;border-radius:12px;margin-top:6px;">`;
        }
        return `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
      });
    }

    function loadMessages() {
      const container = document.getElementById('chat-container');
      container.innerHTML = '';
      if (unsubscribe) { 
        unsubscribe(); 
        unsubscribe = null; 
      }
      if (!currentChatRef) return;

      let isInitialLoad = true;
      setTimeout(() => { isInitialLoad = false; }, 800);

      unsubscribe = onChildAdded(currentChatRef, (snap) => {
        const msg = snap.val();
        if (!msg) return;

        const isMe = msg.uid === auth.currentUser?.uid;
        const div = document.createElement('div');
        div.className = `message ${isMe ? 'sent' : 'received'}`;
        div.dataset.key = snap.key;

        const time = msg.timestamp
          ? new Date(msg.timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
          : '';

        let content = msg.type === 'image' && msg.imageUrl
          ? `<img src="${msg.imageUrl}" alt="Image" loading="lazy">`
          : linkify(msg.text || '');

        let replyHtml = '';
        if (msg.replyTo) {
          replyHtml = `
            <div style="font-size:13px;opacity:0.8;border-left:3px solid ${isMe ? 'rgba(255,255,255,0.5)' : '#007aff'};padding-left:8px;margin-bottom:6px;">
              <strong>${msg.replyTo.name}</strong><br>${msg.replyTo.text}
            </div>`;
        }

        div.innerHTML = `
          ${!isMe ? `<div class="sender-name">${msg.name}</div>` : ''}
          ${replyHtml}
          ${content}
          <div class="timestamp">${time}</div>
        `;

        if (!isMe && !isInitialLoad) {
          showNotif(msg.name || "Someone", msg.text || "Sent an image");
        }

        let pressTimer;
        div.addEventListener('contextmenu', e => showContextMenu(e, msg, div));
        div.addEventListener('touchstart', e => {
          pressTimer = setTimeout(() => showContextMenu(e, msg, div), 550);
        }, { passive: true });
        div.addEventListener('touchend', () => clearTimeout(pressTimer));
        div.addEventListener('touchmove', () => clearTimeout(pressTimer));

        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
      });
    }

    document.getElementById('message-input')?.addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
