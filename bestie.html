<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Bestie • My Lifeline</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #00bcd4;
    --accent: #ff9ff3;
    --background: linear-gradient(135deg, #fff8f0, #e0f7ff);
    --card: #ffffff;
    --text: #2c3e50;
    --shadow: rgba(0,0,0,.15);
    --bestie: #ff9ff3;
    --user: #87ceeb;
}
[data-theme="dark"] {
    --primary: #4fc3f7;
    --accent: #ff79c6;
    --background: linear-gradient(135deg, #0f1c2e, #2c1e3a);
    --card: #2c3e50;
    --text: #e0f2f1;
    --shadow: rgba(0,0,0,.45);
    --bestie: #9b59b6;
    --user: #2980b9;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: 'Quicksand', sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
    transition: .5s;
}
nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999;
    background: rgba(135,206,235,.95);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 25px var(--shadow);
}
[data-theme="dark"] nav {
    background: rgba(26,38,57,.95);
}
.logo {
    font-size: 1.5rem;
    font-weight: 700;
}
.nav-btn {
    background: white;
    color: var(--primary);
    border: none;
    padding: 10px 18px;
    border-radius: 30px;
    font-weight: 700;
    cursor: pointer;
    margin-left: 5px;
}
main {
    max-width: 1000px;
    margin: auto;
    padding: 100px 20px 60px;
}
.hero {
    background: linear-gradient(135deg, var(--primary), #81d4fa);
    color: white;
    padding: 50px 25px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 40px var(--shadow);
}
.hero h1 {
    font-size: 3rem;
}
.hero p {
    margin-top: 12px;
    font-size: 1.2rem;
}
.mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 25px;
}
.mode {
    background: var(--card);
    color: var(--text);
    border: none;
    padding: 18px;
    border-radius: 22px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 30px var(--shadow);
    transition: .3s;
}
.mode:hover {
    transform: translateY(-5px);
}
.mode.active {
    outline: 3px solid var(--primary);
}
.chat-card {
    margin-top: 30px;
    background: var(--card);
    padding: 25px;
    border-radius: 30px;
    box-shadow: 0 10px 35px var(--shadow);
}
.chat-box {
    height: 500px;
    overflow-y: auto;
    padding: 10px;
}
.message {
    max-width: 85%;
    padding: 16px 20px;
    margin: 15px 0;
    border-radius: 25px;
    line-height: 1.6;
    word-wrap: break-word;
}
.bestie {
    background: var(--bestie);
    color: white;
}
.user {
    background: var(--user);
    color: white;
    margin-left: auto;
}
.typing {
    font-style: italic;
    opacity: .7;
}
.input-area {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}
#messageInput {
    flex: 1;
    padding: 16px;
    border-radius: 30px;
    border: 2px solid var(--primary);
    font-family: inherit;
    font-size: 1rem;
    background: var(--card);
    color: var(--text);
    outline: none;
}
.send {
    background: var(--primary);
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
}
.send:disabled {
    opacity: .6;
    cursor: not-allowed;
}
.memory,
.settings {
    margin-top: 25px;
    background: var(--card);
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 10px 30px var(--shadow);
}
.memory h2,
.settings h2 {
    color: var(--primary);
    margin-bottom: 15px;
}
.status {
    margin-top: 12px;
    text-align: center;
    opacity: .7;
    font-size: .9rem;
}
footer {
    text-align: center;
    padding: 40px;
    opacity: .7;
}
@media(max-width:700px) {
    .hero h1 {
        font-size: 2.2rem;
    }
    .input-area {
        flex-direction: column;
    }
    .chat-box {
        height: 420px;
    }
    nav {
        flex-wrap: wrap;
        gap: 10px;
    }
}
</style>
</head>
<body data-theme="light">
<nav>
    <div class="logo">
        🫂 My Lifeline Bestie
    </div>
<div>
    <button class="nav-btn" onclick="location.href='index.html'">
        🏠 Home
    </button>
    <button class="nav-btn" onclick="toggleTheme()">
        🌗
    </button>
</div>
</nav>
<main>
<section class="hero">
    <h1>🫂 AI Bestie</h1>
<p>
    Talk. Vent. Reflect. Breathe. You don't have to hold everything alone.
</p>
</section>
<section class="mode-grid">
<button class="mode active" data-mode="comfort" onclick="changeMode('comfort')">
    💙 Comfort
</button>
<button class="mode" data-mode="vent" onclick="changeMode('vent')">
    🫂 Vent
</button>
<button class="mode" data-mode="hype" onclick="changeMode('hype')">
    🔥 Hype
</button>
<button class="mode" data-mode="calm" onclick="changeMode('calm')">
    🌙 Calm
</button>
<button class="mode" data-mode="reflect" onclick="changeMode('reflect')">
    🧠 Reflect
</button>
</section>
<section class="chat-card">
<div id="chatBox" class="chat-box">
    <div class="message bestie">
        Hey 💙 I'm Bestie.<br><br>
        I'm here to listen. Tell me what's on your mind.
    </div>
</div>
<div class="input-area">
    <input
        id="messageInput"
        type="text"
        autocomplete="off"
        placeholder="Talk to Bestie..."
    >
    <button id="sendButton" class="send" onclick="sendMessage()">
        Send
    </button>
</div>
<div id="status" class="status"></div>
</section>
<section class="memory">
<h2>🧠 Bestie Memory</h2>
<div id="memoryText">
    Messages: 0
</div>
</section>
<section class="settings">
<h2>⚙️ Bestie Settings</h2>
<button class="nav-btn" onclick="clearChat()">
    🗑 Clear Chat
</button>
<button class="nav-btn" onclick="exportBestie()">
    💾 Backup
</button>
<button class="nav-btn" onclick="resetMemory()">
    🧠 Reset Memory
</button>
</section>
</main>
<footer>
    🫂 My Lifeline • AI Bestie
    <br>
    A place to talk, reflect, and feel supported 💙
</footer>
<script>
/* =========================================
   MY LIFELINE AI BESTIE
========================================= */
const API_ENDPOINT = "/api/bestie";
let currentMode =
    localStorage.getItem("bestieMode") || "comfort";
let bestieMemory =
    JSON.parse(
        localStorage.getItem("bestieMemory")
        || "{}"
    );
let chatHistory =
    JSON.parse(
        localStorage.getItem("bestieChatHistory")
        || "[]"
    );
/* =========================================
   THEME
========================================= */
function toggleTheme() {
    const current =
        document.body.dataset.theme;
    const next =
        current === "dark"
        ? "light"
        : "dark";
    document.body.dataset.theme = next;
    localStorage.setItem(
        "lifeline-theme",
        next
    );
}
const savedTheme =
    localStorage.getItem("lifeline-theme");
if (savedTheme) {
    document.body.dataset.theme =
        savedTheme;
}
/* =========================================
   MODE
========================================= */
function changeMode(mode) {
    currentMode = mode;
    localStorage.setItem(
        "bestieMode",
        mode
    );
    document
        .querySelectorAll(".mode")
        .forEach(button => {
            button.classList.toggle(
                "active",
                button.dataset.mode === mode
            );
        });
    addBestie(
        `✨ Bestie is now in ${mode} mode.`
    );
}
/* =========================================
   MEMORY
========================================= */
function saveMemory() {
    localStorage.setItem(
        "bestieMemory",
        JSON.stringify(bestieMemory)
    );
    showMemory();
}
function showMemory() {
    const box =
        document.getElementById("memoryText");
    const messages =
        bestieMemory.messages || 0;
    let text =
        `Messages: <strong>${messages}</strong>`;
    if (bestieMemory.name) {
        text +=
            `<br><br>Name: <strong>${
                escapeHTML(bestieMemory.name)
            }</strong>`;
    }
    if (bestieMemory.likes) {
        text +=
            `<br><br>Likes: <strong>${
                escapeHTML(bestieMemory.likes)
            }</strong>`;
    }
    box.innerHTML = text;
}
/* =========================================
   SIMPLE MEMORY LEARNING
========================================= */
function learn(message) {
    const lower =
        message.toLowerCase();
    const nameMatch =
        message.match(
            /my name is\s+(.+)/i
        );
    if (nameMatch) {
        bestieMemory.name =
            nameMatch[1]
                .trim()
                .slice(0, 80);
    }
    const likeMatch =
        message.match(
            /i (?:like|love)\s+(.+)/i
        );
    if (likeMatch) {
        bestieMemory.likes =
            likeMatch[1]
                .trim()
                .slice(0, 150);
    }
    bestieMemory.messages =
        (bestieMemory.messages || 0) + 1;
    saveMemory();
}
/* =========================================
   CHAT HISTORY
========================================= */
function saveChatHistory() {
    localStorage.setItem(
        "bestieChatHistory",
        JSON.stringify(chatHistory)
    );
}
function recordMessage(role, text) {
    chatHistory.push({
        role,
        text,
        time: new Date().toISOString()
    });
    if (chatHistory.length > 100) {
        chatHistory =
            chatHistory.slice(-100);
    }
    saveChatHistory();
}
/* =========================================
   DISPLAY
========================================= */
function addBestie(text) {
    const box =
        document.getElementById("chatBox");
    const div =
        document.createElement("div");
    div.className =
        "message bestie";
    div.innerHTML =
        formatResponse(text);
    box.appendChild(div);
    box.scrollTop =
        box.scrollHeight;
    recordMessage("assistant", text);
}
function addUser(text) {
    const box =
        document.getElementById("chatBox");
    const div =
        document.createElement("div");
    div.className =
        "message user";
    div.textContent =
        text;
    box.appendChild(div);
    box.scrollTop =
        box.scrollHeight;
    recordMessage("user", text);
}
function formatResponse(text) {
    return escapeHTML(text)
        .replace(/\n/g, "<br>");
}
function escapeHTML(text) {
    const div =
        document.createElement("div");
    div.textContent =
        String(text);
    return div.innerHTML;
}
/* =========================================
   AI REQUEST
========================================= */
async function askBestie(message) {
    const recentMessages =
        chatHistory
            .slice(-12)
            .map(item => ({
                role:
                    item.role === "assistant"
                    ? "assistant"
                    : "user",
                content: item.text
            }));
    const response =
        await fetch(API_ENDPOINT, {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/json"
            },
            body: JSON.stringify({
                message,
                mode:
                    currentMode,
                memory:
                    bestieMemory,
                history:
                    recentMessages
            })
        });
    if (!response.ok) {
        throw new Error(
            `AI request failed: ${response.status}`
        );
    }
    const data =
        await response.json();
    if (!data.reply) {
        throw new Error(
            "The AI server returned no reply."
        );
    }
    return data.reply;
}
/* =========================================
   SEND MESSAGE
========================================= */
let isSending = false;
async function sendMessage() {
    if (isSending)
        return;
    const input =
        document.getElementById(
            "messageInput"
        );
    const button =
        document.getElementById(
            "sendButton"
        );
    const status =
        document.getElementById(
            "status"
        );
    const message =
        input.value.trim();
    if (!message)
        return;
    isSending = true;
    input.value = "";
    input.disabled = true;
    button.disabled = true;
    addUser(message);
    learn(message);
    const typing =
        document.createElement("div");
    typing.className =
        "message bestie typing";
    typing.textContent =
        "Bestie is thinking... 💙";
    document
        .getElementById("chatBox")
        .appendChild(typing);
    document
        .getElementById("chatBox")
        .scrollTop =
            document
                .getElementById("chatBox")
                .scrollHeight;
    status.textContent =
        "Connecting to Bestie...";
    try {
        const reply =
            await askBestie(message);
        typing.remove();
        addBestie(reply);
        status.textContent = "";
    } catch (error) {
        console.error(error);
        typing.remove();
        addBestie(
            "I'm having trouble connecting to my AI right now. 💙 Please try again in a moment."
        );
        status.textContent =
            "AI connection unavailable.";
    } finally {
        isSending = false;
        input.disabled = false;
        button.disabled = false;
        input.focus();
    }
}
/* =========================================
   ENTER KEY
========================================= */
document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        event => {
            if (
                event.key === "Enter"
                && !event.shiftKey
            ) {
                event.preventDefault();
                sendMessage();
            }
        }
    );
/* =========================================
   CLEAR CHAT
========================================= */
function clearChat() {
    if (
        !confirm(
            "Clear your Bestie chat history?"
        )
    ) {
        return;
    }
    chatHistory = [];
    localStorage.removeItem(
        "bestieChatHistory"
    );
    document
        .getElementById("chatBox")
        .innerHTML = `
        <div class="message bestie">
            Chat cleared 💙 I'm still here.
        </div>
        `;
}
/* =========================================
   RESET MEMORY
========================================= */
function resetMemory() {
    if (
        !confirm(
            "Reset Bestie's saved memory?"
        )
    ) {
        return;
    }
    bestieMemory = {};
    localStorage.removeItem(
        "bestieMemory"
    );
    showMemory();
}
/* =========================================
   BACKUP
========================================= */
function exportBestie() {
    const backup = {
        memory:
            bestieMemory,
        history:
            chatHistory,
        mode:
            currentMode,
        exported:
            new Date().toISOString()
    };
    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );
    const url =
        URL.createObjectURL(blob);
    const link =
        document.createElement("a");
    link.href = url;
    link.download =
        "my-lifeline-bestie-backup.json";
    link.click();
    URL.revokeObjectURL(url);
}
/* =========================================
   INITIALIZE
========================================= */
document
    .querySelectorAll(".mode")
    .forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.mode === currentMode
        );
    });
showMemory();
</script>
</body>
</html>
